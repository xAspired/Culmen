[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "culmen"
version = "0.1.0"
description = "Satellite / ground-station contact planning and validation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GianMattia Torrente" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "skyfield>=1.49",
    "sgp4>=2.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The HTTP layer. core/ never imports any of this (ADR 0001).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

# ITU-R P.676 / P.618 atmospheric attenuation. Optional on purpose: core/
# must run on its own dependencies alone (ADR 0001), and without this the two
# terms stay inputs at 0 dB with the optimism declared in assumptions[].
atmosphere = ["itur>=0.4"]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.27",
    "culmen[api]",
    "culmen[atmosphere]",
]

[project.scripts]
culmen = "cli:main"

[tool.setuptools]
packages = ["core", "core.time", "core.orbit", "core.geometry", "core.passes",
            "core.rf", "core.datavol", "core.validation", "core.scheduling",
            "backend", "backend.app", "backend.app.api", "backend.app.services",
            "backend.app.schemas", "backend.app.infrastructure"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fail the build on deprecations WE cause, not on those a third-party library
# emits at import time. A blanket "error::DeprecationWarning" makes the suite
# hostage to every upstream release: starlette and anyio, for instance, emit
# one on import under Python 3.14, which broke collection of the API tests
# before this was narrowed. The module field is matched as a prefix regex
# against the module that raises the warning.
filterwarnings = [
    "error::DeprecationWarning:core",
    "error::DeprecationWarning:backend",
    "error::DeprecationWarning:cli",
    "error::DeprecationWarning:tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["core", "backend"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in a default argument is FastAPI's documented dependency
# injection idiom, not the mutable-default bug B008 exists to catch.
"backend/app/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["core", "backend", "scripts"]
strict = true
# Skyfield and sgp4 ship no type stubs.
[[tool.mypy.overrides]]
module = ["skyfield.*", "sgp4.*", "scipy.*", "yaml", "itur.*"]
ignore_missing_imports = true

[tool.coverage.report]
fail_under = 85
